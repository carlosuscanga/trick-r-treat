<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: el fondo llega hasta debajo del notch; el juego se acomoda con las safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Abierto desde la pantalla de inicio: sin barras de Safari. El título y el ícono llegan con el nombre del juego. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>🎃 Trick-r-Treat</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* El padding deja fuera notch y barra de inicio; Phaser mide #game, que queda dentro. */
      #pantalla {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #gira-telefono {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #1a1a2e;
        color: #ff9a3c;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }

      #gira-telefono .icono {
        font-size: 64px;
        animation: girar 2s ease-in-out infinite;
      }

      #gira-telefono .titulo {
        font-size: 24px;
        font-weight: bold;
      }

      #gira-telefono .ayuda {
        max-width: 280px;
        font-size: 15px;
        color: #d8d8e8;
      }

      @keyframes girar {
        0%, 20% { transform: rotate(0deg); }
        50%, 100% { transform: rotate(-90deg); }
      }

      @media (orientation: portrait) {
        #gira-telefono { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="pantalla">
      <div id="game"></div>
    </div>
    <div id="gira-telefono" role="alert">
      <div class="icono">📱</div>
      <div class="titulo">Gira tu teléfono</div>
      <div class="ayuda">¿No gira? Quita el bloqueo de rotación en el Centro de control.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
